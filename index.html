<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio Pad">
  <title>Radio Pad</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css?v=27">
</head>
<body>
  <header class="topbar">
    <div>
      <time id="currentClock" class="current-clock">--:--:--</time>
    </div>
    <div class="header-actions">
      <button id="openAddDialog" class="add-button" type="button" aria-label="音を追加" title="音を追加">＋</button>
      <button id="stopAll" class="stop-button" type="button" disabled>■ すべて停止</button>
    </div>
  </header>

  <main>
    <section class="now-playing" aria-live="polite">
      <span id="statusDot" class="status-dot"></span>
      <div>
        <small>NOW PLAYING</small>
        <strong id="nowPlaying">待機中</strong>
      </div>
    </section>

    <div id="soundGrid" class="sound-grid" aria-label="登録した音源"></div>

  </main>

  <dialog id="addDialog">
    <div class="add-dialog-content">
      <div class="dialog-title-row">
        <div><p class="eyebrow">ADD SOUNDS</p><h2>音の追加方法</h2></div>
        <button class="icon-close" type="button" data-close-add aria-label="閉じる">×</button>
      </div>
      <label class="add-choice">
        <span class="choice-icon">▶</span>
        <span><strong>通常のパッド</strong><small>選んだ音を1つずつパッドに追加</small></span>
        <input id="fileInput" type="file" multiple hidden>
      </label>
      <label class="add-choice random-choice">
        <span class="choice-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></span>
        <span><strong>ランダム再生セット</strong><small>複数の音を選び、セット名を付けてまとめます</small></span>
        <input id="folderInput" type="file" multiple hidden>
      </label>
    </div>
  </dialog>

  <dialog id="groupNameDialog">
    <form id="groupNameForm" method="dialog">
      <div><p class="eyebrow">RANDOM SET</p><h2>セット名を入力</h2></div>
      <label>表示名<input id="groupNameInput" type="text" required maxlength="30" placeholder="例：ジングル"></label>
      <p class="hint">選択した音源から、押すたびに1つをランダム再生します。</p>
      <div class="dialog-actions simple-actions">
        <span></span>
        <button value="cancel" type="button" data-cancel-group>キャンセル</button>
        <button class="primary" value="default">追加</button>
      </div>
    </form>
  </dialog>

  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <h2>パッドの設定</h2>
      <input id="editId" type="hidden">
      <label>表示名<input id="editName" type="text" required maxlength="30"></label>
      <label class="toggle-row">
        <span><strong>ほかの音に重ねて再生</strong><small>オンの場合、再生中の音を止めずに追加します</small></span>
        <input id="editOverlay" type="checkbox" role="switch">
      </label>
      <div class="schedule-setting">
        <label class="toggle-row">
          <span><strong>決まった時刻に再生</strong><small>アプリを開いている間、毎日自動で再生します</small></span>
          <input id="editScheduleEnabled" type="checkbox" role="switch">
        </label>
        <label class="time-field">再生時刻<input id="editScheduleTime" type="time" value="12:00"></label>
      </div>
      <div class="dialog-actions">
        <button id="deleteSound" class="danger" type="button">削除</button>
        <span></span>
        <button value="cancel" type="button" data-close>キャンセル</button>
        <button class="primary" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <template id="soundTemplate">
    <article class="sound-card">
      <button class="play-pad" type="button">
        <span class="waveform" aria-hidden="true"></span>
        <span class="play-icon">▶</span>
        <span class="pad-bottom">
          <span class="sound-name"></span>
          <span class="progress-wrap" hidden>
            <span class="progress-track"><span class="progress-fill"></span></span>
            <span class="progress-time"><span class="elapsed">0:00</span><span class="duration">0:00</span></span>
          </span>
        </span>
      </button>
      <div class="card-footer"><span class="group-label">グループなし</span><button class="edit-button" type="button" aria-label="設定">•••</button></div>
    </article>
  </template>

  <script src="app.js?v=27"></script>
</body>
</html>
