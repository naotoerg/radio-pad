<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio Pad">
  <title>Radio Pad</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css?v=47">
</head>
<body>
  <header class="topbar">
    <nav class="view-tabs" aria-label="画面切り替え">
      <button class="view-tab active" type="button" data-view="sampler" aria-selected="true">サンプラー</button>
      <button class="view-tab" type="button" data-view="letters" aria-selected="false">お便り <span id="unreadBadge" class="unread-badge" hidden></span></button>
    </nav>
    <time id="currentClock" class="current-clock">--:--:--</time>
    <div class="header-actions">
      <button id="openAddDialog" class="add-button" type="button" aria-label="音を追加" title="音を追加">＋</button>
      <button id="openLetterDisplaySettings" class="letter-settings-button" type="button" aria-label="お便りの文字サイズ" title="お便りの文字サイズ" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"></path></svg></button>
      <button id="stopAll" class="stop-button" type="button" disabled>■ すべて停止</button>
    </div>
  </header>

  <main>
    <section id="samplerView" class="app-view">
      <section class="now-playing" aria-live="polite">
        <span id="statusDot" class="status-dot"></span>
        <div>
          <small>NOW PLAYING</small>
          <strong id="nowPlaying">待機中</strong>
        </div>
        <button id="enableTimerAudio" class="enable-audio-button" type="button">音声を準備</button>
      </section>

      <div id="soundGrid" class="sound-grid" aria-label="登録した音源"></div>
    </section>

    <section id="lettersView" class="app-view letters-view" hidden>
      <div class="letters-toolbar">
        <div class="letters-title-line"><h2>リスナーからのお便り</h2><p id="lettersSummary">Googleフォームと接続してください</p></div>
        <div class="letters-actions">
          <span id="lettersLoadingIndicator" class="letters-loading" hidden>読み込んでいます…</span>
          <button id="refreshLetters" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"></path></svg>更新</button>
          <button id="openLetterConfig" type="button" aria-label="お便りの接続設定">接続設定</button>
        </div>
      </div>
      <div id="lettersStatus" class="letters-status">
        <strong>回答シートはまだ接続されていません</strong>
        <span>「接続設定」にApps ScriptのURLとアクセスキーを入力すると、ここでお便りを確認できます。</span>
      </div>
      <div id="lettersList" class="letters-list" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="letterDisplayDialog">
    <form method="dialog">
      <div><p class="eyebrow">DISPLAY</p><h2>お便りの文字サイズ</h2></div>
      <label class="scale-setting"><span>サイズ <output id="letterScaleOutput">100%</output></span><input id="letterScaleInput" type="range" min="0.75" max="2" step="0.05" value="1"></label>
      <div class="dialog-actions simple-actions"><button id="resetLetterScale" type="button">標準に戻す</button><span></span><button class="primary" value="default">完了</button></div>
    </form>
  </dialog>

  <dialog id="letterConfigDialog">
    <form id="letterConfigForm">
      <div><p class="eyebrow">LETTERS</p><h2>Googleフォームと接続</h2></div>
      <label>Apps ScriptのURL<input id="letterEndpoint" type="url" required inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
      <label>アクセスキー<input id="letterToken" type="password" required autocomplete="off"></label>
      <p class="hint">URLとキーはこの端末内だけに保存され、GitHubには送信されません。</p>
      <div class="dialog-actions simple-actions">
        <span></span>
        <button type="button" data-close-letter-config>キャンセル</button>
        <button class="primary" value="default">保存して接続</button>
      </div>
    </form>
  </dialog>

  <dialog id="addDialog">
    <div class="add-dialog-content">
      <div class="dialog-title-row">
        <div><p class="eyebrow">ADD SOUNDS</p><h2>音の追加方法</h2></div>
        <button class="icon-close" type="button" data-close-add aria-label="閉じる">×</button>
      </div>
      <label class="add-choice">
        <span class="choice-icon">▶</span>
        <span><strong>通常のパッド</strong><small>選んだ音を1つずつパッドに追加</small></span>
        <input id="fileInput" type="file" multiple hidden>
      </label>
      <label class="add-choice random-choice">
        <span class="choice-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></span>
        <span><strong>ランダム再生セット</strong><small>複数の音を選び、セット名を付けてまとめます</small></span>
        <input id="folderInput" type="file" multiple hidden>
      </label>
    </div>
  </dialog>

  <dialog id="groupNameDialog">
    <form id="groupNameForm" method="dialog">
      <div><p class="eyebrow">RANDOM SET</p><h2 tabindex="-1">セット名を入力</h2></div>
      <label>表示名<span class="name-input-row"><input id="groupNameInput" type="text" required maxlength="30" placeholder="例：ジングル" autocomplete="off" enterkeyhint="done"><button type="button" data-native-name="groupNameInput">名前を入力</button></span></label>
      <p class="hint">選択した音源から、押すたびに1つをランダム再生します。</p>
      <div class="dialog-actions simple-actions">
        <span></span>
        <button value="cancel" type="button" data-cancel-group>キャンセル</button>
        <button class="primary" value="default">追加</button>
      </div>
    </form>
  </dialog>

  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <h2 tabindex="-1">パッドの設定</h2>
      <input id="editId" type="hidden">
      <label>表示名<span class="name-input-row"><input id="editName" type="text" required maxlength="30" autocomplete="off" enterkeyhint="done"><button type="button" data-native-name="editName">名前を入力</button></span></label>
      <label class="toggle-row">
        <span><strong>ほかの音に重ねて再生</strong><small>オンの場合、再生中の音を止めずに追加します</small></span>
        <input id="editOverlay" type="checkbox" role="switch">
      </label>
      <div class="schedule-setting">
        <label class="toggle-row">
          <span><strong>決まった時刻に再生</strong><small>アプリを開いている間、毎日自動で再生します</small></span>
          <input id="editScheduleEnabled" type="checkbox" role="switch">
        </label>
        <label class="time-field">再生時刻<input id="editScheduleTime" type="time" value="12:00"></label>
      </div>
      <div class="dialog-actions">
        <button id="deleteSound" class="danger" type="button">削除</button>
        <span></span>
        <button value="cancel" type="button" data-close>キャンセル</button>
        <button class="primary" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <template id="soundTemplate">
    <article class="sound-card">
      <button class="play-pad" type="button">
        <span class="waveform" aria-hidden="true"></span>
        <span class="play-icon">▶</span>
        <span class="pad-bottom">
          <span class="sound-name"></span>
          <span class="progress-wrap" hidden>
            <span class="progress-track"><span class="progress-fill"></span></span>
            <span class="progress-time"><span class="elapsed">0:00</span><span class="duration">0:00</span></span>
          </span>
        </span>
      </button>
      <div class="card-footer"><span class="group-label">グループなし</span><button class="edit-button" type="button" aria-label="設定">•••</button></div>
    </article>
  </template>

  <script src="app.js?v=47"></script>
</body>
</html>
